<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輔導紀錄生成器 - 專業敘事與ＡＩ轉譯</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F8F9FA; }
        .font-serif { font-family: 'Noto Serif TC', serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        input[type="date"] { min-height: 2.5rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- 安全的圖示組件 ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const [svgHtml, setSvgHtml] = useState('');
            const updateIcon = useCallback(() => {
                if (window.lucide && window.lucide.icons && window.lucide.icons[name]) {
                    const icon = window.lucide.icons[name];
                    const svg = icon.toSvg({
                        width: size,
                        height: size,
                        class: className,
                        'stroke-width': 2,
                    });
                    setSvgHtml(svg);
                }
            }, [name, size, className]);

            useEffect(() => {
                updateIcon();
                const interval = setInterval(() => {
                    if (window.lucide && window.lucide.icons) {
                        updateIcon();
                        clearInterval(interval);
                    }
                }, 100);
                return () => clearInterval(interval);
            }, [updateIcon]);

            return (
                <span className="inline-flex items-center justify-center shrink-0" dangerouslySetInnerHTML={{ __html: svgHtml }} />
            );
        };

        const CATEGORIES = ['情緒困擾', '人際關係', '學習適應', '家庭議題', '生涯規劃', '競賽壓力'];
        const SEMESTERS = ['112-1', '112-2', '113-1', '113-2', '114-1', '114-2', '115-1'];

        const App = () => {
            // Gemini API Key: 優先使用環境變數，若無則使用 localStorage
            const [apiKey, setApiKey] = useState(() => {
                const envKey = ""; // 環境自動注入
                return envKey || localStorage.getItem('counseling_api_key') || "AIzaSyA14tNgdvaEStytuio6V6ELr3hE8662McA";
            });
            
            const [records, setRecords] = useState([]);
            const [activeId, setActiveId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [isEditing, setIsEditing] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [copyStatus, setCopyStatus] = useState(false);
            const [currentSemester, setCurrentSemester] = useState('114-1');
            const [rawIncident, setRawIncident] = useState("");
            const [draft, setDraft] = useState(null);
            const [errorMessage, setErrorMessage] = useState("");
            
            // ✨ AI 額外功能狀態
            const [aiInsight, setAiInsight] = useState("");
            const [aiScript, setAiScript] = useState("");

            const saveApiKey = (val) => {
                const trimmed = val.trim();
                setApiKey(trimmed);
                localStorage.setItem('counseling_api_key', trimmed);
                if (trimmed) setErrorMessage("");
            };

            useEffect(() => {
                const demo = {
                    id: 'demo-1',
                    studentName: '陳生',
                    date: new Date().toISOString().split('T')[0],
                    category: '學習適應',
                    title: '範例：作業書寫品質介入',
                    content: '【114-1輔導1】\n\n【事件】近日老師發現陳生作業書寫的狀況非常糟糕。\n\n【策略】\n1.和陳生進行晤談。\n2.和家長進行溝通。\n\n【建議】陳生處事較不積極，需要老師持續引導。',
                    status: '已完成',
                    aiInsight: '陳生的潦草可能源於對成功的恐懼或家庭的高期望壓力。建議除了要求品質，也要多關注其對作業的情緒反應。',
                    aiScript: '「陳生，最近寫作業的時候，你有感覺到哪些困難嗎？老師注意到你的字體和平時不太一樣，是不是最近心情有點悶？」'
                };
                setRecords([demo]);
            }, []);

            const createNewRecord = () => {
                const newId = Date.now().toString();
                const newRecord = {
                    id: newId,
                    studentName: '',
                    date: new Date().toISOString().split('T')[0],
                    category: '學習適應',
                    title: '新紀錄',
                    content: '',
                    status: '草稿',
                    aiInsight: '',
                    aiScript: ''
                };
                setRecords(prev => [newRecord, ...prev]);
                setActiveId(newId);
                setDraft({...newRecord});
                setRawIncident("");
                setAiInsight("");
                setAiScript("");
                setIsEditing(true);
                setErrorMessage("");
            };

            const handleSave = () => {
                if (!draft) return;
                const updatedDraft = { ...draft, aiInsight, aiScript };
                setRecords(prev => prev.map(r => r.id === draft.id ? updatedDraft : r));
                setDraft(updatedDraft);
                setIsEditing(false);
            };

            const handleCopy = (text) => {
                if (!text) return;
                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    setCopyStatus(true);
                    setTimeout(() => setCopyStatus(false), 2000);
                } catch (err) {
                    setErrorMessage("複製功能受限");
                }
            };

            // ✨ 通用 Gemini API 呼叫函式 (含指數退避)
            const callGemini = async (prompt, systemInstruction) => {
                const maxRetries = 5;
                let delay = 1000;

                for (let i = 0; i < maxRetries; i++) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{ parts: [{ text: prompt }] }],
                                systemInstruction: { parts: [{ text: systemInstruction }] }
                            })
                        });
                        
                        if (!response.ok) {
                            const errorData = await response.json();
                            throw new Error(errorData.error?.message || `HTTP ${response.status}`);
                        }
                        
                        const data = await response.json();
                        return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    } catch (error) {
                        if (i === maxRetries - 1) throw error;
                        await new Promise(res => setTimeout(res, delay));
                        delay *= 2;
                    }
                }
            };

            const translateIncident = async () => {
                if (!rawIncident.trim()) return;
                if (!apiKey) {
                    setErrorMessage("請輸入有效 API Key。");
                    return;
                }
                
                setErrorMessage("");
                setIsGenerating(true);

                const sysPrompt = `你是一位資深的學校導師與專業輔導老師。將用戶提供的「偶發事件描述」轉譯成專業的「輔導紀錄格式」。
                
                規則：
                1. 稱謂：一律使用「姓氏 + 生」（如陳生）。
                2. 格式：【${currentSemester}輔導1】、【事件】、【策略】(條列)、【建議】。
                3. 符號：禁止任何星號(*)，不使用Markdown粗體。
                4. 內容生成：如果輸入過於簡短（如「我快起死」），請推測是教師面臨的壓力，並生成關懷教師心靈或穩定學生系統的轉譯內容。`;

                try {
                    const result = await callGemini(`偶發事件內容：\n${rawIncident}`, sysPrompt);
                    const cleanResult = result.replace(/\*/g, '');
                    setDraft(prev => (prev ? { ...prev, content: cleanResult } : null));
                    setIsEditing(true);
                } catch (error) {
                    setErrorMessage(`⚠️ 轉譯錯誤：${error.message}`);
                } finally {
                    setIsGenerating(false);
                }
            };

            // ✨ 新功能：深度洞察
            const generateInsight = async () => {
                if (!draft?.content && !rawIncident) return;
                setErrorMessage("");
                setIsGenerating(true);

                const sysPrompt = `你是一位臨床心理師與資深輔導主任。請分析目前的輔導紀錄，提供深層的心理洞察。
                重點：
                1. 分析學生的行為背後可能的情緒需求。
                2. 若老師表達了疲憊（如「起死」），請先給予老師一句溫暖的鼓勵。
                3. 提供 2-3 點針對該個案的系統性建議。
                4. 字數約 100-150 字，不使用星號。`;

                try {
                    const sourceText = draft?.content || rawIncident;
                    const result = await callGemini(sourceText, sysPrompt);
                    setAiInsight(result.replace(/\*/g, ''));
                } catch (error) {
                    setErrorMessage(`⚠️ 洞察分析錯誤：${error.message}`);
                } finally {
                    setIsGenerating(false);
                }
            };

            // ✨ 新功能：晤談腳本
            const generateScript = async () => {
                if (!draft?.content && !rawIncident) return;
                setErrorMessage("");
                setIsGenerating(true);

                const sysPrompt = `你是一位充滿同理心的諮商心理師。請根據輔導內容，為老師設計下一次晤談的「具體對話建議」。
                包含：
                1. 溫暖的開場白。
                2. 兩個開放式問題。
                3. 嚴格不使用星號。`;

                try {
                    const sourceText = draft?.content || rawIncident;
                    const result = await callGemini(sourceText, sysPrompt);
                    setAiScript(result.replace(/\*/g, ''));
                } catch (error) {
                    setErrorMessage(`⚠️ 腳本生成錯誤：${error.message}`);
                } finally {
                    setIsGenerating(false);
                }
            };

            // 當選取不同紀錄時更新 AI 狀態
            useEffect(() => {
                if (activeId && !draft) {
                    const record = records.find(r => r.id === activeId);
                    if (record) {
                        setDraft({...record});
                        setAiInsight(record.aiInsight || "");
                        setAiScript(record.aiScript || "");
                    }
                }
            }, [activeId, records, draft]);

            const filteredRecords = records.filter(r => 
                (r.studentName || '').includes(searchQuery) || (r.title || '').includes(searchQuery)
            );

            return (
                <div className="flex h-screen overflow-hidden fade-in">
                    {/* Sidebar */}
                    <aside className="w-80 border-r border-neutral-200 bg-white flex flex-col shadow-sm z-20 shrink-0">
                        <div className="p-6 border-b border-neutral-100 bg-indigo-50/30">
                            <h1 className="text-xl font-black text-neutral-900 flex items-center gap-2">
                                <Icon name="sparkles" className="text-indigo-600" />
                                輔導紀錄生成器
                            </h1>
                            <p className="text-[10px] text-neutral-400 mt-1 font-bold italic tracking-wider">Incidence to Narrative</p>
                        </div>

                        <div className="p-4">
                            <div className="relative">
                                <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400" />
                                <input 
                                    type="text" 
                                    placeholder="搜尋紀錄..."
                                    className="w-full pl-9 pr-4 py-2 bg-neutral-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/20"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                            </div>
                        </div>

                        <nav className="flex-1 overflow-y-auto p-4 space-y-2">
                            <button onClick={createNewRecord} className="w-full py-3 rounded-xl border-2 border-dashed border-neutral-200 text-neutral-500 hover:border-indigo-400 hover:text-indigo-600 transition-all flex items-center justify-center gap-2 font-medium mb-4">
                                <Icon name="plus" size={18} /> 建立新紀錄
                            </button>
                            {filteredRecords.map(record => (
                                <div key={record.id} onClick={() => { setActiveId(record.id); setDraft({...record}); setAiInsight(record.aiInsight || ""); setAiScript(record.aiScript || ""); setIsEditing(false); setErrorMessage(""); }} className={`group p-4 rounded-2xl cursor-pointer transition-all border ${activeId === record.id ? 'bg-indigo-50 border-indigo-100 shadow-sm' : 'bg-white border-transparent hover:bg-neutral-50'}`}>
                                    <div className="flex justify-between items-start mb-1 font-bold text-neutral-900">
                                        <span className="truncate mr-2">{record.studentName || '未命名'}</span>
                                        <span className="text-[10px] bg-neutral-200 px-2 py-0.5 rounded-full text-neutral-600 uppercase whitespace-nowrap tracking-tighter">{record.category}</span>
                                    </div>
                                    <p className="text-xs text-neutral-400 truncate italic">「{record.title}」</p>
                                </div>
                            ))}
                        </nav>
                        
                        <div className="p-5 bg-neutral-900 text-white space-y-3">
                            <div className="flex items-center justify-between text-[10px] font-black uppercase text-indigo-400">
                                <span className="flex items-center gap-1.5"><Icon name="key" size={12} /> API KEY</span>
                                <span className={apiKey ? "text-green-400" : "text-rose-400"}>{apiKey ? "READY" : "MISSING"}</span>
                            </div>
                            <input 
                                type="password" 
                                placeholder="貼上 API Key"
                                className="w-full px-3 py-2 text-xs rounded-lg border border-white/10 bg-white/5 focus:outline-none focus:ring-1 focus:ring-indigo-500 text-white"
                                value={apiKey}
                                onChange={(e) => saveApiKey(e.target.value)}
                            />
                        </div>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col bg-white overflow-hidden relative">
                        {activeId && draft ? (
                            <>
                                <header className="px-8 py-4 border-b border-neutral-100 flex justify-between items-center bg-white/90 backdrop-blur-md sticky top-0 z-10">
                                    <div className="flex items-center gap-4">
                                        <div className="p-2 bg-indigo-100 text-indigo-700 rounded-xl"><Icon name="file-text" /></div>
                                        <div>
                                            <h2 className="text-base font-black text-neutral-900 leading-tight">紀錄校對器</h2>
                                            <div className="text-[10px] text-neutral-400 font-mono tracking-tighter uppercase">{draft.date} | {draft.status}</div>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <button onClick={() => setIsEditing(!isEditing)} className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all ${isEditing ? 'bg-white text-neutral-600 border-neutral-200 shadow-sm' : 'bg-indigo-50 text-indigo-600 border-indigo-100'}`}>
                                            {isEditing ? '切換檢視' : '編輯模式'}
                                        </button>
                                        <button onClick={() => handleCopy(draft.content)} className={`px-4 py-2 rounded-xl text-xs font-bold border flex items-center gap-2 transition-all ${copyStatus ? 'bg-green-600 text-white border-green-600' : 'bg-white text-neutral-600 hover:bg-neutral-50 shadow-sm'}`}>
                                            <Icon name={copyStatus ? "check" : "copy"} size={14} /> {copyStatus ? '已複製' : '複製紀錄'}
                                        </button>
                                        <button onClick={handleSave} className="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-xl shadow-indigo-200 flex items-center gap-2 active:scale-95 transition-transform">
                                            <Icon name="save" size={16} /> 儲存紀錄
                                        </button>
                                    </div>
                                </header>

                                <div className="flex-1 overflow-y-auto flex">
                                    {/* Left: AI Control Panel */}
                                    <div className="w-80 border-r border-neutral-100 p-6 space-y-6 bg-neutral-50/50 overflow-y-auto shrink-0">
                                        <div className="space-y-4 text-xs">
                                            <label className="font-black text-indigo-600 uppercase tracking-widest flex items-center gap-2">
                                                <Icon name="layers" size={14} /> 學年度
                                            </label>
                                            <select value={currentSemester} onChange={(e) => setCurrentSemester(e.target.value)} className="w-full bg-white border border-neutral-200 rounded-xl px-3 py-2 outline-none shadow-sm">
                                                {SEMESTERS.map(s => <option key={s} value={s}>{s} 學年度</option>)}
                                            </select>
                                            
                                            <label className="font-black text-indigo-600 uppercase tracking-widest flex items-center gap-2 pt-4">
                                                <Icon name="wand-2" size={14} /> ＡＩ轉譯引擎
                                            </label>
                                            <textarea 
                                                className="w-full h-40 p-4 bg-white border border-neutral-200 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500/20 outline-none shadow-inner resize-none leading-relaxed" 
                                                placeholder="在此輸入原始觀察或您的情緒壓力紀錄..." 
                                                value={rawIncident} 
                                                onChange={(e) => setRawIncident(e.target.value)}
                                            ></textarea>
                                            
                                            <button onClick={translateIncident} disabled={isGenerating || !rawIncident.trim()} className="w-full py-3 bg-neutral-900 text-white rounded-2xl text-xs font-black flex items-center justify-center gap-2 hover:bg-neutral-800 disabled:opacity-50 transition-all shadow-md">
                                                {isGenerating ? <div className="animate-spin h-3 w-3 border-2 border-white/20 border-t-white rounded-full"></div> : <Icon name="sparkles" size={14} />} 執行轉譯
                                            </button>

                                            <div className="pt-4 border-t border-neutral-200 space-y-3">
                                                <p className="text-[10px] font-black text-neutral-400 uppercase tracking-widest">增強功能</p>
                                                <button onClick={generateInsight} disabled={isGenerating} className="w-full py-3 bg-indigo-50 text-indigo-700 rounded-xl text-xs font-bold flex items-center justify-center gap-2 hover:bg-indigo-100 transition-all border border-indigo-100">
                                                    ✨ 深度洞察與分析
                                                </button>
                                                <button onClick={generateScript} disabled={isGenerating} className="w-full py-3 bg-amber-50 text-amber-700 rounded-xl text-xs font-bold flex items-center justify-center gap-2 hover:bg-amber-100 transition-all border border-amber-100">
                                                    ✨ 生成晤談腳本
                                                </button>
                                            </div>
                                            
                                            {errorMessage && <div className="p-4 bg-rose-50 border border-rose-100 text-rose-600 text-[11px] rounded-2xl flex items-start gap-2 fade-in font-medium leading-relaxed italic"><Icon name="alert-circle" size={14} className="shrink-0 mt-0.5" />{errorMessage}</div>}
                                        </div>
                                    </div>

                                    {/* Right: Record Editor & AI View */}
                                    <div className="flex-1 p-8 lg:p-12 overflow-y-auto bg-white">
                                        <div className="max-w-3xl mx-auto space-y-10">
                                            {/* Basic Info */}
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8 border-b border-neutral-50 pb-10">
                                                <div className="space-y-2 text-[10px] font-black text-neutral-400 uppercase tracking-widest">
                                                    學生姓名
                                                    <input disabled={!isEditing} className="w-full text-2xl font-black bg-transparent border-b-2 border-neutral-100 focus:border-indigo-500 text-neutral-800 outline-none pb-1 disabled:border-transparent transition-all" value={draft.studentName || ''} onChange={(e) => setDraft({...draft, studentName: e.target.value})} />
                                                </div>
                                                <div className="space-y-2 text-[10px] font-black text-neutral-400 uppercase tracking-widest">
                                                    事件日期
                                                    <input disabled={!isEditing} type="date" className="w-full text-xl font-bold bg-transparent border-b-2 border-neutral-100 focus:border-indigo-500 text-neutral-800 outline-none pb-1 disabled:border-transparent transition-all h-10 px-2" value={draft.date || ''} onChange={(e) => setDraft({...draft, date: e.target.value})} />
                                                </div>
                                            </div>
                                            
                                            {/* AI Insight Section ✨ */}
                                            {(aiInsight || isGenerating) && (
                                                <div className="bg-indigo-50/50 rounded-[2rem] p-8 border border-indigo-100/50 fade-in relative overflow-hidden">
                                                    <div className="absolute top-0 right-0 p-4 opacity-[0.05] pointer-events-none">
                                                        <Icon name="brain" size={100} />
                                                    </div>
                                                    <h4 className="text-[10px] font-black text-indigo-600 uppercase tracking-widest mb-4 flex items-center gap-2">
                                                        <Icon name="sparkles" size={14} /> AI 深度洞察分析
                                                    </h4>
                                                    <div className="text-sm leading-relaxed text-indigo-900 font-medium">
                                                        {aiInsight || <div className="h-20 animate-pulse bg-indigo-100 rounded-xl"></div>}
                                                    </div>
                                                </div>
                                            )}

                                            {/* AI Script Section ✨ */}
                                            {(aiScript || isGenerating) && (
                                                <div className="bg-amber-50/50 rounded-[2rem] p-8 border border-amber-100/50 fade-in relative overflow-hidden">
                                                    <div className="absolute top-0 right-0 p-4 opacity-[0.05] pointer-events-none">
                                                        <Icon name="message-square" size={100} />
                                                    </div>
                                                    <div className="flex justify-between items-center mb-4">
                                                        <h4 className="text-[10px] font-black text-amber-600 uppercase tracking-widest flex items-center gap-2">
                                                            <Icon name="sparkles" size={14} /> 晤談引導腳本
                                                        </h4>
                                                        <button onClick={() => handleCopy(aiScript)} className="text-[10px] font-bold text-amber-500 hover:text-amber-700 transition-colors">點擊複製</button>
                                                    </div>
                                                    <div className="text-sm leading-relaxed text-amber-900 italic font-serif">
                                                        {aiScript || <div className="h-16 animate-pulse bg-amber-100 rounded-xl"></div>}
                                                    </div>
                                                </div>
                                            )}
                                            
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 items-end">
                                                <div className="md:col-span-2 space-y-2 text-[10px] font-black text-neutral-400 uppercase tracking-widest">
                                                    紀錄主題
                                                    <input disabled={!isEditing} className="w-full text-lg italic text-neutral-500 bg-neutral-50 px-4 py-2 rounded-xl outline-none font-serif disabled:bg-white transition-all" value={draft.title || ''} onChange={(e) => setDraft({...draft, title: e.target.value})} />
                                                </div>
                                                <div className="space-y-2 text-[10px] font-black text-neutral-400 uppercase tracking-widest">
                                                    介入類別
                                                    <select disabled={!isEditing} className="w-full bg-neutral-50 px-3 py-2.5 rounded-xl text-xs font-bold outline-none cursor-pointer disabled:bg-white" value={draft.category || '學習適應'} onChange={(e) => setDraft({...draft, category: e.target.value})}>
                                                        {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="space-y-4">
                                                <div className="flex justify-between items-end text-[10px] font-black text-neutral-400 uppercase tracking-widest border-l-4 border-indigo-600 pl-3">轉譯內容文本</div>
                                                <div className="relative group">
                                                    <textarea disabled={!isEditing} className="w-full min-h-[500px] p-8 lg:p-10 bg-neutral-50 rounded-[2.5rem] text-[15px] leading-[2.2] text-neutral-700 outline-none focus:ring-4 focus:ring-indigo-500/5 transition-all disabled:bg-white border border-transparent focus:border-indigo-100 font-serif shadow-inner shadow-neutral-100/50" value={draft.content || ''} onChange={(e) => setDraft({...draft, content: e.target.value})}></textarea>
                                                    {!isEditing && draft.content && (
                                                        <button onClick={() => handleCopy(draft.content)} className="absolute top-8 right-8 p-4 bg-white/90 backdrop-blur shadow-2xl border border-neutral-100 rounded-full text-neutral-400 hover:text-indigo-600 hover:scale-110 transition-all opacity-0 group-hover:opacity-100"><Icon name={copyStatus ? "check" : "copy"} size={22} className={copyStatus ? "text-green-500" : ""} /></button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-neutral-400 fade-in px-10 text-center space-y-4">
                                <div className="w-24 h-24 bg-neutral-50 rounded-full flex items-center justify-center shadow-inner animate-pulse"><Icon name="book-open" size={40} className="text-neutral-200" /></div>
                                <h3 className="text-xl font-black text-neutral-700 uppercase tracking-tighter italic tracking-widest">點擊建立新劇本，捕獲生命的敘事脈絡</h3>
                                <button onClick={createNewRecord} className="px-10 py-4 bg-indigo-600 text-white rounded-[2rem] font-black shadow-2xl shadow-indigo-100 hover:scale-105 active:scale-95 transition-all flex items-center gap-3"><Icon name="plus" size={20} /> 建立新劇本</button>
                            </div>
                        )}
                    </main>
                    <div className="fixed bottom-0 right-0 p-12 opacity-[0.02] pointer-events-none select-none"><Icon name="sparkles" size={500} /></div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
