<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輔導紀錄生成器 - 專業敘事與ＡＩ轉譯</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@400;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        .font-serif {
            font-family: 'Noto Serif TC', serif;
        }
        /* 自定義捲軸 */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #d1d5db;
        }
    </style>
</head>
<body class="bg-[#F8F9FA] text-neutral-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 圖示組件輔助 (由於 CDN 環境限制，手寫 SVG 以確保穩定) ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const [svg, setSvg] = useState("");
            useEffect(() => {
                if (window.lucide) {
                    const iconSvg = window.lucide.createIcons();
                }
            }, []);
            return <i data-lucide={name} style={{width: size, height: size}} className={className}></i>;
        };

        const CATEGORIES = ['情緒困擾', '人際關係', '學習適應', '家庭議題', '生涯規劃', '競賽壓力'];
        const SEMESTERS = ['112-1', '112-2', '113-1', '113-2', '114-1', '114-2', '115-1'];

        const App = () => {
            const [records, setRecords] = useState([]);
            const [activeId, setActiveId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [isEditing, setIsEditing] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [copyStatus, setCopyStatus] = useState(false);
            const [currentSemester, setCurrentSemester] = useState('114-1');
            const [rawIncident, setRawIncident] = useState("");
            const [draft, setDraft] = useState(null);

            const apiKey = "AIzaSyA14tNgdvaEStytuio6V6ELr3hE8662McA"; // 執行環境會自動注入或手動填入

            useEffect(() => {
                const demo = {
                    id: 'demo-1',
                    studentName: '陳生',
                    date: new Date().toISOString().split('T')[0],
                    category: '學習適應',
                    title: '關於作業書寫品質的結構性介入',
                    content: '【114-1輔導1】\n\n【事件】近日老師發現陳生作業書寫的狀況非常糟糕，字體潦草，且錯誤非常多。\n\n【策略】\n1.和陳生進行晤談，告知作業書寫是很重要的練習，要認真用心的完成。\n2.和家長進行溝通，請家長協助在家先協助叮嚀，避免陳生在校花太多時間訂正，影響休息時間。\n3.與陳生和家長達成共識，未來作業也會請陳生到校馬上讓老師批改確認。\n\n【建議】陳生是一位較不積極的孩子，容易用得過且過的態度做事，需要老師多引導。家長配合度很好，親師互動良好。',
                    status: '已完成'
                };
                setRecords([demo]);
                lucide.createIcons();
            }, []);

            useEffect(() => {
                lucide.createIcons();
            }, [activeId, records, isEditing, isGenerating, copyStatus]);

            const createNewRecord = () => {
                const newRecord = {
                    id: Date.now().toString(),
                    studentName: '',
                    date: new Date().toISOString().split('T')[0],
                    category: '情緒困擾',
                    title: '新紀錄',
                    content: '',
                    status: '草稿'
                };
                setRecords([newRecord, ...records]);
                setActiveId(newRecord.id);
                setDraft(newRecord);
                setRawIncident("");
                setIsEditing(true);
            };

            const handleSave = () => {
                if (!draft) return;
                setRecords(records.map(r => r.id === draft.id ? draft : r));
                setIsEditing(false);
            };

            const handleCopy = () => {
                if (!draft?.content) return;
                const textArea = document.createElement("textarea");
                textArea.value = draft.content;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    setCopyStatus(true);
                    setTimeout(() => setCopyStatus(false), 2000);
                } catch (err) {
                    console.error('無法複製文字', err);
                }
                document.body.removeChild(textArea);
            };

            const translateIncident = async () => {
                if (!rawIncident.trim()) return;
                setIsGenerating(true);

                const systemPrompt = `你是一位專業的學校輔導老師。將用戶提供的「偶發事件描述」轉譯成正式的「輔導紀錄格式」。嚴格遵守：1. 稱謂規範：一律使用「姓氏 + 生」。2. 格式：【${currentSemester}輔導1】、 【事件】、【策略】(條列)、【建議】。3. 嚴禁任何星號(*)。4. 專業客觀語氣。`;
                const userPrompt = `偶發事件內容：\n${rawIncident}`;

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userPrompt }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });
                    const data = await response.json();
                    const result = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    const cleanResult = result.replace(/\*/g, '');
                    setDraft(prev => ({ ...prev, content: cleanResult }));
                    setIsEditing(true);
                } catch (error) {
                    console.error(error);
                } finally {
                    setIsGenerating(false);
                }
            };

            const filteredRecords = records.filter(r => 
                r.studentName.includes(searchQuery) || r.title.includes(searchQuery)
            );

            return (
                <div className="flex h-screen overflow-hidden">
                    {/* Sidebar */}
                    <aside className="w-80 border-r border-neutral-200 bg-white flex flex-col shadow-sm z-20">
                        <div className="p-6 border-b border-neutral-100">
                            <h1 className="text-xl font-bold text-neutral-900 flex items-center gap-2">
                                <Icon name="sparkles" className="text-indigo-600" />
                                輔導紀錄生成器
                            </h1>
                            <p className="text-[10px] text-neutral-400 mt-1 uppercase tracking-[0.2em] font-bold">Incidence to Narrative</p>
                        </div>

                        <div className="p-4">
                            <div className="relative">
                                <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400" />
                                <input 
                                    type="text" 
                                    placeholder="搜尋學生..."
                                    className="w-full pl-9 pr-4 py-2 bg-neutral-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/20 transition-all"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                            </div>
                        </div>

                        <nav className="flex-1 overflow-y-auto p-4 space-y-2">
                            <button 
                                onClick={createNewRecord}
                                className="w-full py-3 rounded-xl border-2 border-dashed border-neutral-200 text-neutral-500 hover:border-indigo-400 hover:text-indigo-600 transition-all flex items-center justify-center gap-2 font-medium mb-4"
                            >
                                <Icon name="plus" size={18} /> 新增輔導個案
                            </button>
                            
                            {filteredRecords.map(record => (
                                <div 
                                    key={record.id}
                                    onClick={() => { setActiveId(record.id); setDraft(record); setIsEditing(false); }}
                                    className={`group p-4 rounded-2xl cursor-pointer transition-all border ${
                                        activeId === record.id ? 'bg-indigo-50 border-indigo-100' : 'bg-white border-transparent hover:bg-neutral-50'
                                    }`}
                                >
                                    <div className="flex justify-between items-start mb-1">
                                        <span className="font-bold text-neutral-900">{record.studentName || '未命名'}</span>
                                        <span className="text-[10px] bg-neutral-200 px-2 py-0.5 rounded-full text-neutral-600">{record.category}</span>
                                    </div>
                                    <p className="text-xs text-neutral-500 line-clamp-1 italic">{record.title}</p>
                                </div>
                            ))}
                        </nav>
                    </aside>

                    {/* Main Content */}
                    <main className="flex-1 flex flex-col bg-white overflow-hidden relative">
                        {activeId && draft ? (
                            <>
                                <header className="px-8 py-4 border-b border-neutral-100 flex justify-between items-center bg-white/90 backdrop-blur-md sticky top-0 z-10">
                                    <div className="flex items-center gap-4">
                                        <div className="p-2 bg-indigo-50 text-indigo-600 rounded-lg">
                                            <Icon name="file-text" />
                                        </div>
                                        <div>
                                            <h2 className="text-base font-bold text-neutral-900">紀錄編輯面板</h2>
                                            <div className="flex items-center gap-2 text-[10px] text-neutral-400 font-mono">
                                                <Icon name="clock" size={10} /> 系統版本: 2026.04.30
                                            </div>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <button onClick={() => { if(confirm('確定刪除？')) deleteRecord(draft.id) }} className="p-2 text-neutral-400 hover:text-red-500 transition-colors">
                                            <Icon name="trash-2" />
                                        </button>
                                        
                                        <button 
                                            onClick={() => setIsEditing(!isEditing)} 
                                            className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all ${isEditing ? 'bg-white text-neutral-600 border-neutral-200 shadow-sm' : 'bg-indigo-50 text-indigo-600 border-indigo-100'}`}
                                        >
                                            {isEditing ? '檢視模式' : '解除鎖定'}
                                        </button>

                                        <button 
                                            onClick={handleCopy}
                                            className={`px-4 py-2 rounded-xl text-xs font-bold border flex items-center gap-2 transition-all ${copyStatus ? 'bg-green-600 text-white border-green-600' : 'bg-white text-neutral-600 border-neutral-200 hover:bg-neutral-50 shadow-sm'}`}
                                        >
                                            <Icon name={copyStatus ? "check" : "copy"} size={14} />
                                            {copyStatus ? '已複製內容' : '複製內容'}
                                        </button>

                                        <button onClick={handleSave} className="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-lg shadow-indigo-100 flex items-center gap-2">
                                            <Icon name="save" size={16} /> 儲存紀錄
                                        </button>
                                    </div>
                                </header>

                                <div className="flex-1 overflow-y-auto flex">
                                    {/* Left: AI Transfer Tool */}
                                    <div className="w-1/3 border-r border-neutral-100 p-8 space-y-6 bg-neutral-50/50 overflow-y-auto">
                                        <div className="space-y-4">
                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-indigo-600 uppercase tracking-widest flex items-center gap-2">
                                                    <Icon name="layers" size={14} /> 學年度設定
                                                </label>
                                                <select 
                                                    value={currentSemester}
                                                    onChange={(e) => setCurrentSemester(e.target.value)}
                                                    className="w-full bg-white border border-neutral-200 rounded-xl px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500/20"
                                                >
                                                    {SEMESTERS.map(s => <option key={s} value={s}>{s} 學年度</option>)}
                                                </select>
                                            </div>

                                            <div className="space-y-2">
                                                <label className="text-[10px] font-black text-indigo-600 uppercase tracking-widest flex items-center gap-2">
                                                    <Icon name="wand-2" size={14} /> ＡＩ轉譯
                                                </label>
                                                <p className="text-xs text-neutral-400 leading-relaxed">
                                                    輸入偶發事件描述，自動優化稱謂並去除星號。
                                                </p>
                                            </div>
                                        </div>
                                        
                                        <textarea 
                                            className="w-full h-64 p-4 bg-white border border-neutral-200 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500/20 outline-none transition-all placeholder:text-neutral-300 shadow-inner resize-none"
                                            placeholder="例如：今天陳小明在課堂上..."
                                            value={rawIncident}
                                            onChange={(e) => setRawIncident(e.target.value)}
                                        ></textarea>

                                        <button 
                                            onClick={translateIncident}
                                            disabled={isGenerating || !rawIncident.trim()}
                                            className="w-full py-3 bg-neutral-900 text-white rounded-2xl text-xs font-bold flex items-center justify-center gap-2 hover:bg-neutral-800 disabled:opacity-50 transition-all shadow-xl active:scale-95"
                                        >
                                            {isGenerating ? <div className="animate-spin h-4 w-4 border-2 border-white/20 border-t-white rounded-full"></div> : <Icon name="sparkles" size={16} />}
                                            ＡＩ轉譯
                                        </button>
                                    </div>

                                    {/* Right: Record Content */}
                                    <div className="flex-1 p-12 overflow-y-auto">
                                        <div className="max-w-2xl mx-auto space-y-10">
                                            <section className="grid grid-cols-2 gap-8">
                                                <div className="space-y-2">
                                                    <label className="text-[10px] font-black text-neutral-400 uppercase tracking-widest">學生主角</label>
                                                    <input 
                                                        disabled={!isEditing}
                                                        className="w-full text-xl font-bold bg-transparent border-b border-neutral-100 focus:border-indigo-500 outline-none pb-1 disabled:border-transparent"
                                                        value={draft.studentName}
                                                        onChange={(e) => setDraft({...draft, studentName: e.target.value})}
                                                    />
                                                </div>
                                                <div className="space-y-2">
                                                    <label className="text-[10px] font-black text-neutral-400 uppercase tracking-widest">日期記錄</label>
                                                    <input 
                                                        disabled={!isEditing}
                                                        type="date"
                                                        className="w-full text-xl bg-transparent border-b border-neutral-100 focus:border-indigo-500 outline-none pb-1 disabled:border-transparent"
                                                        value={draft.date}
                                                        onChange={(e) => setDraft({...draft, date: e.target.value})}
                                                    />
                                                </div>
                                            </section>

                                            <section className="space-y-4">
                                                <div className="flex items-center gap-4">
                                                    <div className="flex-1 space-y-2">
                                                        <label className="text-[10px] font-black text-neutral-400 uppercase tracking-widest">紀錄標題</label>
                                                        <input 
                                                            disabled={!isEditing}
                                                            className="w-full text-lg italic text-neutral-600 bg-neutral-50 px-4 py-2 rounded-lg outline-none disabled:bg-white"
                                                            value={draft.title}
                                                            onChange={(e) => setDraft({...draft, title: e.target.value})}
                                                        />
                                                    </div>
                                                    <div className="space-y-2">
                                                        <label className="text-[10px] font-black text-neutral-400 uppercase tracking-widest">類別</label>
                                                        <select 
                                                            disabled={!isEditing}
                                                            className="block bg-neutral-50 px-3 py-2 rounded-lg text-sm outline-none disabled:bg-white disabled:appearance-none"
                                                            value={draft.category}
                                                            onChange={(e) => setDraft({...draft, category: e.target.value})}
                                                        >
                                                            {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                                        </select>
                                                    </div>
                                                </div>
                                            </section>

                                            <section className="space-y-4">
                                                <div className="flex justify-between items-center">
                                                    <label className="text-[10px] font-black text-neutral-400 uppercase tracking-widest">最終轉譯紀錄內容</label>
                                                    {isGenerating && <span className="text-[10px] text-indigo-500 animate-pulse font-bold tracking-widest">轉譯中...</span>}
                                                </div>
                                                
                                                <div className="relative group">
                                                    <textarea 
                                                        disabled={!isEditing}
                                                        className="w-full min-h-[500px] p-8 bg-neutral-50 rounded-[2.5rem] text-sm leading-loose text-neutral-700 outline-none focus:ring-2 focus:ring-indigo-500/10 transition-all disabled:bg-white border border-transparent focus:border-indigo-100 font-serif"
                                                        value={draft.content}
                                                        onChange={(e) => setDraft({...draft, content: e.target.value})}
                                                    ></textarea>
                                                    
                                                    {!isEditing && (
                                                        <button 
                                                            onClick={handleCopy}
                                                            className="absolute top-6 right-6 p-3 bg-white/80 backdrop-blur shadow-sm border border-neutral-100 rounded-full text-neutral-400 hover:text-indigo-600 hover:shadow-md transition-all opacity-0 group-hover:opacity-100"
                                                            title="快速複製"
                                                        >
                                                            <Icon name={copyStatus ? "check" : "copy"} size={18} className={copyStatus ? "text-green-500" : ""} />
                                                        </button>
                                                    )}
                                                </div>
                                            </section>
                                        </div>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-neutral-400">
                                <div className="w-20 h-20 bg-neutral-50 rounded-full flex items-center justify-center mb-4">
                                    <Icon name="book-open" size={32} className="text-neutral-200" />
                                </div>
                                <p className="text-sm font-medium">請選擇個案，或開始新的轉譯</p>
                                <button onClick={createNewRecord} className="mt-4 px-8 py-3 bg-indigo-600 text-white rounded-2xl font-bold shadow-xl shadow-indigo-100 hover:scale-105 transition-all">生成新紀錄</button>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
