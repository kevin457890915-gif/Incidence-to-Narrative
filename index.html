<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輔導紀錄生成器 - 專業敘事與ＡＩ轉譯</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&family=Noto+Serif+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #F8F9FA; }
        .font-serif { font-family: 'Noto Serif TC', serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 10px; }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // --- 安全的圖示組件 ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const iconRef = useRef(null);
            const refresh = useCallback(() => {
                if (window.lucide && iconRef.current) {
                    try { window.lucide.createIcons(); } catch(e) {}
                }
            }, [name]);

            useEffect(() => {
                refresh();
                const timer = setTimeout(refresh, 100);
                return () => clearTimeout(timer);
            }, [refresh]);

            return <i data-lucide={name} ref={iconRef} style={{width: size, height: size}} className={`inline-block ${className}`}></i>;
        };

        const CATEGORIES = ['情緒困擾', '人際關係', '學習適應', '家庭議題', '生涯規劃', '競賽壓力'];
        const SEMESTERS = ['112-1', '112-2', '113-1', '113-2', '114-1', '114-2', '115-1'];

        const App = () => {
            const [apiKey, setApiKey] = useState(() => localStorage.getItem('counseling_api_key') || "AIzaSyA14tNgdvaEStytuio6V6ELr3hE8662McA"); 
            const [records, setRecords] = useState([]);
            const [activeId, setActiveId] = useState(null);
            const [searchQuery, setSearchQuery] = useState('');
            const [isEditing, setIsEditing] = useState(false);
            const [isGenerating, setIsGenerating] = useState(false);
            const [copyStatus, setCopyStatus] = useState(false);
            const [currentSemester, setCurrentSemester] = useState('114-1');
            const [rawIncident, setRawIncident] = useState("");
            const [draft, setDraft] = useState(null);
            const [errorMessage, setErrorMessage] = useState("");

            const saveApiKey = (val) => {
                const trimmed = val.trim();
                setApiKey(trimmed);
                localStorage.setItem('counseling_api_key', trimmed);
                if (trimmed) setErrorMessage("");
            };

            useEffect(() => {
                const demo = {
                    id: 'demo-1',
                    studentName: '陳生',
                    date: new Date().toISOString().split('T')[0],
                    category: '學習適應',
                    title: '範例：作業書寫品質介入',
                    content: '【114-1輔導1】\n\n【事件】近日老師發現陳生作業書寫的狀況非常糟糕。\n\n【策略】\n1.和陳生進行晤談。\n2.和家長進行溝通。\n\n【建議】陳生處事較不積極，需要老師持續引導。',
                    status: '已完成'
                };
                setRecords([demo]);
            }, []);

            const createNewRecord = () => {
                const newRecord = {
                    id: Date.now().toString(),
                    studentName: '',
                    date: new Date().toISOString().split('T')[0],
                    category: '學習適應',
                    title: '新紀錄',
                    content: '',
                    status: '草稿'
                };
                setRecords([newRecord, ...records]);
                setActiveId(newRecord.id);
                setDraft(newRecord);
                setRawIncident("");
                setIsEditing(true);
                setErrorMessage("");
            };

            const handleSave = () => {
                if (!draft) return;
                setRecords(records.map(r => r.id === draft.id ? draft : r));
                setIsEditing(false);
            };

            const handleCopy = () => {
                if (!draft?.content) return;
                try {
                    const textArea = document.createElement("textarea");
                    textArea.value = draft.content;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    setCopyStatus(true);
                    setTimeout(() => setCopyStatus(false), 2000);
                } catch (err) {
                    setErrorMessage("複製功能受限");
                }
            };

            const translateIncident = async () => {
                if (!rawIncident.trim()) return;
                if (!apiKey) {
                    setErrorMessage("請輸入 API Key。");
                    return;
                }
                
                setErrorMessage("");
                setIsGenerating(true);

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `偶發事件內容：\n${rawIncident}` }] }],
                            systemInstruction: { parts: [{ text: `你是一位專業輔導老師。轉譯格式：【${currentSemester}輔導1】、【事件】、【策略】(條列)、【建議】。嚴格要求：稱謂用「姓氏+生」（如陳生）、禁止輸出星號(*)、語氣客觀專業。` }] }
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        throw new Error(data.error?.message || `HTTP ${response.status}`);
                    }
                    
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (!aiText) throw new Error("AI 未回傳有效內容，請更換描述重試。");
                    
                    const cleanResult = aiText.replace(/\*/g, '');
                    
                    if (draft) {
                        setDraft(prev => ({ ...prev, content: cleanResult }));
                    } else {
                        // 防禦邏輯：如果 draft 不存在，嘗試尋找 activeId
                        const target = records.find(r => r.id === activeId);
                        if (target) setDraft({ ...target, content: cleanResult });
                    }
                    setIsEditing(true);
                } catch (error) {
                    setErrorMessage(`⚠️ 發生錯誤：${error.message}`);
                } finally {
                    setIsGenerating(false);
                }
            };

            const filteredRecords = records.filter(r => 
                (r.studentName || '').includes(searchQuery) || (r.title || '').includes(searchQuery)
            );

            return (
                <div className="flex h-screen overflow-hidden fade-in">
                    {/* Sidebar */}
                    <aside className="w-80 border-r border-neutral-200 bg-white flex flex-col shadow-sm z-20">
                        <div className="p-6 border-b border-neutral-100 bg-indigo-50/30">
                            <h1 className="text-xl font-black text-neutral-900 flex items-center gap-2">
                                <Icon name="sparkles" className="text-indigo-600" />
                                輔導紀錄生成器
                            </h1>
                            <p className="text-[10px] text-neutral-400 mt-1 font-bold italic tracking-wider">Incidence to Narrative</p>
                        </div>

                        <div className="p-4">
                            <div className="relative">
                                <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-neutral-400" />
                                <input 
                                    type="text" 
                                    placeholder="搜尋紀錄..."
                                    className="w-full pl-9 pr-4 py-2 bg-neutral-100 rounded-xl text-sm outline-none focus:ring-2 focus:ring-indigo-500/20"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                />
                            </div>
                        </div>

                        <nav className="flex-1 overflow-y-auto p-4 space-y-2">
                            <button onClick={createNewRecord} className="w-full py-3 rounded-xl border-2 border-dashed border-neutral-200 text-neutral-500 hover:border-indigo-400 hover:text-indigo-600 transition-all flex items-center justify-center gap-2 font-medium mb-4">
                                <Icon name="plus" size={18} /> 建立新紀錄
                            </button>
                            {filteredRecords.map(record => (
                                <div key={record.id} onClick={() => { setActiveId(record.id); setDraft({...record}); setIsEditing(false); setErrorMessage(""); }} className={`group p-4 rounded-2xl cursor-pointer transition-all border ${activeId === record.id ? 'bg-indigo-50 border-indigo-100' : 'bg-white border-transparent hover:bg-neutral-50'}`}>
                                    <div className="flex justify-between items-start mb-1 font-bold text-neutral-900">
                                        <span>{record.studentName || '未命名'}</span>
                                        <span className="text-[10px] bg-neutral-200 px-2 py-0.5 rounded-full text-neutral-600 uppercase">{record.category}</span>
                                    </div>
                                    <p className="text-xs text-neutral-400 truncate italic">「{record.title}」</p>
                                </div>
                            ))}
                        </nav>
                        
                        <div className="p-5 bg-neutral-900 text-white space-y-3">
                            <div className="flex items-center justify-between text-[10px] font-black uppercase text-indigo-400">
                                <span className="flex items-center gap-1.5"><Icon name="key" size={12} /> API KEY</span>
                                <span className={apiKey ? "text-green-400" : "text-rose-400"}>{apiKey ? "READY" : "MISSING"}</span>
                            </div>
                            <input 
                                type="password" 
                                placeholder="貼上 API Key"
                                className="w-full px-3 py-2 text-xs rounded-lg border border-white/10 bg-white/5 focus:outline-none focus:ring-1 focus:ring-indigo-500 text-white"
                                value={apiKey}
                                onChange={(e) => saveApiKey(e.target.value)}
                            />
                        </div>
                    </aside>

                    {/* Main */}
                    <main className="flex-1 flex flex-col bg-white overflow-hidden relative">
                        {activeId && draft ? (
                            <>
                                <header className="px-8 py-4 border-b border-neutral-100 flex justify-between items-center bg-white/90 backdrop-blur-md sticky top-0 z-10">
                                    <div className="flex items-center gap-4">
                                        <div className="p-2 bg-indigo-100 text-indigo-700 rounded-xl"><Icon name="file-text" /></div>
                                        <div>
                                            <h2 className="text-base font-black text-neutral-900">紀錄校對</h2>
                                            <div className="text-[10px] text-neutral-400 font-mono tracking-tighter uppercase">{draft.date} | {draft.status}</div>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <button onClick={() => setIsEditing(!isEditing)} className={`px-4 py-2 rounded-xl text-xs font-bold border transition-all ${isEditing ? 'bg-white text-neutral-600' : 'bg-indigo-50 text-indigo-600 border-indigo-100'}`}>
                                            {isEditing ? '檢視' : '編輯'}
                                        </button>
                                        <button onClick={handleCopy} className={`px-4 py-2 rounded-xl text-xs font-bold border flex items-center gap-2 transition-all ${copyStatus ? 'bg-green-600 text-white border-green-600' : 'bg-white text-neutral-600 hover:bg-neutral-50 shadow-sm'}`}>
                                            <Icon name={copyStatus ? "check" : "copy"} size={14} /> {copyStatus ? '已複製' : '複製'}
                                        </button>
                                        <button onClick={handleSave} className="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-xl shadow-indigo-200 flex items-center gap-2 active:scale-95 transition-transform">
                                            <Icon name="save" size={16} /> 儲存
                                        </button>
                                    </div>
                                </header>

                                <div className="flex-1 overflow-y-auto flex">
                                    <div className="w-80 border-r border-neutral-100 p-6 space-y-6 bg-neutral-50/50 overflow-y-auto">
                                        <div className="space-y-4 text-xs">
                                            <label className="font-black text-indigo-600 uppercase tracking-widest flex items-center gap-2">
                                                <Icon name="layers" size={14} /> 學年度
                                            </label>
                                            <select value={currentSemester} onChange={(e) => setCurrentSemester(e.target.value)} className="w-full bg-white border border-neutral-200 rounded-xl px-3 py-2 outline-none shadow-sm">
                                                {SEMESTERS.map(s => <option key={s} value={s}>{s} 學年度</option>)}
                                            </select>
                                            
                                            <label className="font-black text-indigo-600 uppercase tracking-widest flex items-center gap-2 pt-4">
                                                <Icon name="wand-2" size={14} /> ＡＩ轉譯面板
                                            </label>
                                            <textarea className="w-full h-72 p-4 bg-white border border-neutral-200 rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500/20 outline-none shadow-inner resize-none leading-relaxed" placeholder="在此輸入原始觀察..." value={rawIncident} onChange={(e) => setRawIncident(e.target.value)}></textarea>
                                            
                                            {errorMessage && <div className="p-4 bg-rose-50 border border-rose-100 text-rose-600 text-[11px] rounded-2xl flex items-start gap-2 fade-in font-medium leading-relaxed italic"><Icon name="alert-circle" size={14} className="shrink-0 mt-0.5" />{errorMessage}</div>}
                                            
                                            <button onClick={translateIncident} disabled={isGenerating || !rawIncident.trim()} className="w-full py-4 bg-neutral-900 text-white rounded-2xl text-xs font-black flex items-center justify-center gap-2 hover:bg-neutral-800 disabled:opacity-50 active:scale-95 transition-all shadow-xl">
                                                {isGenerating ? <div className="animate-spin h-4 w-4 border-2 border-white/20 border-t-white rounded-full"></div> : <Icon name="sparkles" size={16} />} 執行轉譯
                                            </button>
                                        </div>
                                    </div>

                                    <div className="flex-1 p-12 overflow-y-auto bg-white">
                                        <div className="max-w-2xl mx-auto space-y-12">
                                            <div className="grid grid-cols-2 gap-8">
                                                <div className="space-y-2 text-[10px] font-black text-neutral-400 uppercase tracking-widest">
                                                    學生姓名
                                                    <input disabled={!isEditing} className="w-full text-2xl font-black bg-transparent border-b-2 border-neutral-100 focus:border-indigo-500 text-neutral-800 outline-none pb-1 disabled:border-transparent transition-all" value={draft.studentName} onChange={(e) => setDraft({...draft, studentName: e.target.value})} />
                                                </div>
                                                <div className="space-y-2 text-[10px] font-black text-neutral-400 uppercase tracking-widest">
                                                    事件日期
                                                    <input disabled={!isEditing} type="date" className="w-full text-xl font-bold bg-transparent border-b-2 border-neutral-100 focus:border-indigo-500 text-neutral-800 outline-none pb-1 disabled:border-transparent transition-all" value={draft.date} onChange={(e) => setDraft({...draft, date: e.target.value})} />
                                                </div>
                                            </div>
                                            
                                            <div className="grid grid-cols-3 gap-6 items-end">
                                                <div className="col-span-2 space-y-2 text-[10px] font-black text-neutral-400 uppercase tracking-widest">
                                                    紀錄主題
                                                    <input disabled={!isEditing} className="w-full text-lg italic text-neutral-500 bg-neutral-50 px-4 py-2 rounded-xl outline-none font-serif disabled:bg-white transition-all" value={draft.title} onChange={(e) => setDraft({...draft, title: e.target.value})} />
                                                </div>
                                                <div className="space-y-2 text-[10px] font-black text-neutral-400 uppercase tracking-widest">
                                                    介入類別
                                                    <select disabled={!isEditing} className="w-full bg-neutral-50 px-3 py-2.5 rounded-xl text-xs font-bold outline-none cursor-pointer disabled:bg-white" value={draft.category} onChange={(e) => setDraft({...draft, category: e.target.value})}>
                                                        {CATEGORIES.map(c => <option key={c} value={c}>{c}</option>)}
                                                    </select>
                                                </div>
                                            </div>

                                            <div className="space-y-4">
                                                <div className="flex justify-between items-end text-[10px] font-black text-neutral-400 uppercase tracking-widest border-l-4 border-indigo-600 pl-3">轉譯內容文本</div>
                                                <div className="relative group">
                                                    <textarea disabled={!isEditing} className="w-full min-h-[500px] p-10 bg-neutral-50 rounded-[3rem] text-[15px] leading-[2.2] text-neutral-700 outline-none focus:ring-4 focus:ring-indigo-500/5 transition-all disabled:bg-white border border-transparent focus:border-indigo-100 font-serif shadow-inner" value={draft.content} onChange={(e) => setDraft({...draft, content: e.target.value})}></textarea>
                                                    {!isEditing && draft.content && (
                                                        <button onClick={handleCopy} className="absolute top-8 right-8 p-4 bg-white/90 backdrop-blur shadow-2xl border border-neutral-100 rounded-full text-neutral-400 hover:text-indigo-600 hover:scale-110 transition-all opacity-0 group-hover:opacity-100"><Icon name={copyStatus ? "check" : "copy"} size={22} className={copyStatus ? "text-green-500" : ""} /></button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="flex-1 flex flex-col items-center justify-center text-neutral-400 fade-in px-10 text-center space-y-4">
                                <div className="w-24 h-24 bg-neutral-50 rounded-full flex items-center justify-center shadow-inner animate-pulse"><Icon name="book-open" size={40} className="text-neutral-200" /></div>
                                <h3 className="text-xl font-black text-neutral-700 uppercase tracking-tighter">準備開始捕獲敘事？</h3>
                                <p className="text-xs max-w-sm leading-loose italic">請選取一份既有紀錄，或是點擊下方按鈕，為孩子搭起新的生命舞台。</p>
                                <button onClick={createNewRecord} className="px-10 py-4 bg-indigo-600 text-white rounded-[2rem] font-black shadow-2xl shadow-indigo-100 hover:scale-105 active:scale-95 transition-all flex items-center gap-3"><Icon name="plus" size={20} /> 建立新劇本</button>
                            </div>
                        )}
                    </main>
                    <div className="fixed bottom-0 right-0 p-12 opacity-[0.02] pointer-events-none select-none"><Icon name="sparkles" size={500} /></div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
